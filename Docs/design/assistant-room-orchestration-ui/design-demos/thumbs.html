<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>任务编排 方向总览</title><style>

 solid #c1a35a;background:#2f2a50;border-radius:9px;padding:10px;display:grid;gap:7px}.focus-card h3{margin:0;color:#f2e3b6;font-size:15px}.focus-card .step{font-size:12px;display:flex;justify-content:space-between;gap:8px;background:#211e41;padding:5px 7px;border-radius:5px;flex-wrap:wrap}a{color:#e8c96d} @media(max-width:1050px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:650px){body{padding:10px}.grid{grid-template-columns:1fr}.screen{height:auto;min-height:245px}.pic{height:auto}}
</style></head><body><main><h1>任务编排 · 六个方向</h1><p>同一套紫金主题、同一组示例状态；不同的是信息组织方式。A/B/C 为完整可交互设计稿，D/E/F 为备选骨架。</p><section class="grid">
<figure data-thumb="1"><div class="screen pic"><img src="dir-1.png" alt="纵向接力图，房间卡片与切房动作按纵向排列"></div><figcaption>A · 纵向接力图（推荐）<span>逐项状态与接续动作在同一阅读线上。</span></figcaption></figure>
<figure data-thumb="2"><div class="screen pic"><img src="dir-2.png" alt="横向三个房间关系图"></div><figcaption>B · 横向关系图<span>横向看整条路线，窄窗自动换行。</span></figcaption></figure>
<figure data-thumb="3"><div class="screen pic"><img src="dir-3.png" alt="顶部路线与下方选中房间详细配置"></div><figcaption>C · 全局路线＋房间详情<span>适合重点监看当前执行房间。</span></figcaption></figure>

<figure data-thumb="5"><div class="screen"><div class="head">任务编排 <small>房间接续路径</small></div><div class="lane"><div class="room-tile"><b>罐传精房</b><span class="done status">✓ 2/2 已完成</span><span class="step">准备任务已完成</span></div><div class="arr">→</div><div class="room-tile active"><b>精英讨伐房</b><span class="run status">▷ 当前 · 第2/3项</span><span class="step">精英讨伐</span></div></div><div style="text-align:right;color:#bcb7d8;font-size:12px">↓ 完成后进入地脉房</div><div class="lane"><div class="room-tile"><b>素材采集房</b><span class="pending status">? 无记录</span></div><div class="arr"></div><div class="room-tile"><b>地脉房</b><span class="pending status">○ 未开始</span></div></div></div><figcaption>E · 双层关系图<span>节点紧凑；多条回环会增加布局复杂性。</span></figcaption></figure>
