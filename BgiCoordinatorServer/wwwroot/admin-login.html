<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>联机锄地 · 全服监控登录</title>
  <meta name="theme-color" content="#141527">
  <style>
    :root{font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;color-scheme:dark;--gold:#e8c96d;--muted:#b2aec7;--line:#3d3e54}
    *{box-sizing:border-box}
    body{min-height:100dvh;margin:0;display:grid;place-items:center;padding:24px 16px;background:radial-gradient(120% 60% at 50% -10%,#2a2747 0%,#141527 62%);color:#f4f2fa;-webkit-font-smoothing:antialiased}
    main{width:min(100%,400px);padding:32px 30px 28px;border:1px solid var(--line);border-radius:16px;background:#1d1e34;box-shadow:0 24px 70px #07081866}
    .brand{display:flex;align-items:center;gap:12px}
    .mark{color:var(--gold);font-size:32px;line-height:1}
    h1{font-size:22px;font-weight:600;margin:0;letter-spacing:.04em}
    .eyebrow{color:var(--muted);font-size:12px;margin:2px 0 0}
    p.lead{color:var(--muted);font-size:14px;line-height:1.6;margin:18px 0 22px}
    label{display:block;font-size:13px;color:var(--muted);margin-bottom:7px}
    input{width:100%;min-height:46px;padding:11px 13px;border:1px solid #56556c;border-radius:9px;background:#151629;color:#fff;font:inherit;outline:none}
    input:focus{border-color:var(--gold);box-shadow:0 0 0 3px #e8c96d22}
    button{width:100%;min-height:46px;margin-top:16px;padding:11px;border:0;border-radius:9px;background:var(--gold);color:#29241a;font:inherit;font-weight:600;cursor:pointer}
    button:hover{background:#f0d581}
    button:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
    button:disabled{opacity:.6;cursor:wait}
    .error:empty{display:none}
    .error{margin-top:12px;color:#efa48d;font-size:14px}
  </style>
</head>
<body>
  <main>
    <div class="brand"><span class="mark" aria-hidden="true">◇</span><div><h1>联机锄地 · 全服监控</h1><p class="eyebrow">Nexus BGI · 管理员</p></div></div>
    <p class="lead">输入管理员密码，查看全部房间与日志。</p>
    <form id="loginForm">
      <label for="password">管理员密码</label>
      <input id="password" type="password" autocomplete="current-password" required autofocus>
      <button id="submitButton" type="submit">进入监控</button>
      <div id="error" class="error" role="alert"></div>
    </form>
  </main>
  <script>
    const form=document.getElementById('loginForm');
    form.addEventListener('submit',async event=>{
      event.preventDefault();
      const button=document.getElementById('submitButton');
      const error=document.getElementById('error');
      button.disabled=true;error.textContent='';
      try{
        const response=await fetch('/api/admin/login',{
          method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},
          body:JSON.stringify({password:document.getElementById('password').value})
        });
        if(response.ok){location.replace('/admin/hoeing');return;}
        error.textContent=response.status===401?'密码不正确':response.status===429?'尝试过于频繁，请稍后再试':'登录暂不可用';
      }catch{error.textContent='无法连接服务器';}
      button.disabled=false;
    });
  </script>
</body>
</html>
