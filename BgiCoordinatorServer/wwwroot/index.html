<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#141527"><title>耕地机 · Nexus BGI</title><link rel="stylesheet" href="control-room.css?v=20261030-brand"><link rel="stylesheet" href="dodoco-web.css?v=20261030-rl1"><link rel="stylesheet" href="project-star.css?v=20261029-polish"><link rel="stylesheet" href="mistletoe-web.css?v=20261029-mt3"></head>
<body>
<section id="loginPanel" class="login-card">
 <a class="project-star login-star" href="https://github.com/kaedelcb/better-genshin-impact" target="_blank" rel="noopener noreferrer" aria-label="在 GitHub 打开茶包项目，点亮 Star（新标签页）"><span class="project-star-spark" aria-hidden="true">✦</span><span class="project-star-copy"><strong>喜欢茶包？在 GitHub 点亮 Star</strong></span><span class="project-star-badge" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 2.8 15 9l6.8 1-4.9 4.8 1.1 6.8-6-3.2-6 3.2 1.1-6.8L2.2 10 9 9z"/></svg>Star</span></a><div class="login-brand"><span class="brand-mark" aria-hidden="true">◇</span><div><h1>提瓦特生物灭绝计划</h1><p class="eyebrow">Nexus BGI</p></div></div><p class="subtitle">你的队伍，随时掌握。</p>
 <form id="loginForm" onsubmit="event.preventDefault(); joinRoom()">
 <label class="field-label" for="roomCode">控制房间</label><input type="text" id="roomCode" placeholder="房间码" autocomplete="off" required>
 <label class="field-label" for="password">房间密码</label><input type="password" id="password" placeholder="输入房间密码" required>
 <label class="field-label" for="nickname">控制端昵称</label><input type="text" id="nickname" placeholder="例如：网页指挥员" maxlength="50">
 <label class="check-row remember-row"><input type="checkbox" id="rememberMe" checked> 在此浏览器记住登录信息</label>
 <button id="joinButton" type="submit" class="btn btn-primary btn-lg">进入控制房间</button><p id="loginError" class="error" role="alert"></p>
 </form><p class="login-note">支持手机与电脑 · 远程操作需目标助手在线</p>
</section>
<main id="controlPanel" class="container" style="display:none">
 <header class="topbar"><div class="brand"><span class="brand-mark" aria-hidden="true">◇</span><div><strong>提瓦特生物灭绝计划</strong><small>Nexus BGI</small></div></div><div class="room"><strong id="roomInfo"></strong><span><i id="connDot" class="dot dot-offline"></i><span id="connectionText">连接未就绪</span></span></div><nav class="product-nav" aria-label="功能导航"><button id="gengdiProduct" class="active" onclick="showProduct('gengdi')">耕地机</button><button id="dodocoProduct" onclick="showProduct('dodoco')">嘟嘟可<span class="nav-long"> · 日志与监控</span></button><button id="mistletoeProduct" onclick="showProduct('mistletoe')">槲寄生<span class="nav-long"> · 启动与任务</span></button></nav><a class="project-star top-star" href="https://github.com/kaedelcb/better-genshin-impact" target="_blank" rel="noopener noreferrer" aria-label="在 GitHub 打开茶包项目，点亮 Star（新标签页）"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M12 2.8 15 9l6.8 1-4.9 4.8 1.1 6.8-6-3.2-6 3.2 1.1-6.8L2.2 10 9 9z"/></svg><span>Star</span></a><button class="icon-button" onclick="openSettings()" aria-label="网页设置">设置</button></header>
 <nav id="gengdiNav" class="page-nav"><button id="homeTab" class="active" onclick="showHome()">房间成员</button><button id="detailTab" disabled onclick="openMemberDetail(activeMemberUid)">成员详情</button><button onclick="document.getElementById('activity').scrollIntoView({behavior:'smooth'})">操作记录</button></nav>
 <section id="homeView"><div id="roomSummary"></div><section class="quick-section"><div class="section-heading"><h2>联机快捷指令</h2><button class="text-button" onclick="showLegacyQuickMenu()">网页任务</button></div><div id="quickRow" class="quick-row"><button class="quick-btn" data-key="一键锄地">一键锄地</button><button class="quick-btn" data-key="传奇">传奇</button><button class="quick-btn" data-key="次数盾">次数盾</button><button class="quick-btn" data-key="精英">精英</button><button class="quick-btn" data-key="小怪">小怪</button><button class="quick-btn" data-key="自定义">自定义</button></div></section>
 <div class="section-heading"><h2>房间成员 <span id="memberCount" class="muted"></span></h2><button id="selectAll" class="text-button" onclick="toggleSelectedMembers()">选择在线成员</button></div><div id="memberList" class="member-list"></div></section>
 <section id="detailView" hidden><div id="detailHeader"></div><nav id="detailTabs" class="detail-tabs"></nav><div id="detailContent"></div></section>
 <section id="dodocoView" hidden></section>
 <section id="mistletoeView" hidden></section>
 <section id="activity" class="activity"><div class="section-heading"><h2>操作记录</h2><button class="text-button" onclick="document.getElementById('logArea').replaceChildren()">清空本页记录</button></div><div id="logArea" class="log" role="log" aria-live="polite"></div></section>
</main><footer id="selectionBar" class="selection-bar" hidden></footer>
<script src="signalr.min.js"></script><script src="control-room.js?v=20261029-mt1"></script><script src="control-room-commands.js?v=20261027-a"></script><script src="control-room-ui.js?v=20261029-head"></script>
<script src="dodoco-web.js?v=20261030-rl1"></script>
<script src="dodoco-operations.js?v=20261030-rl1"></script>
<script src="dodoco-remote-logs.js?v=20261030-rl1"></script>
<script src="mistletoe-core.js?v=20261029-mt1"></script><script src="mistletoe-startup.js?v=20261029-mt1"></script><script src="mistletoe-startup-view.js?v=20261029-mt1"></script><script src="mistletoe-taskcenter.js?v=20261030-mt4"></script><script src="mistletoe-web.js?v=20261029-mt1"></script>
</body></html>
