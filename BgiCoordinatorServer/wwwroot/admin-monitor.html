<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>联机锄地 · 全服监控</title>
  <style>
    :root{font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif;color-scheme:dark;background:#101820;color:#edf3f1}
    *{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}
    .shell{max-width:1180px;margin:auto;padding:30px 24px 70px}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:28px}
    .eyebrow{color:#86cdb0;font-size:12px;font-weight:700;letter-spacing:.14em}.top h1{font-size:29px;margin:8px 0 6px}.subtitle,.muted{color:#a8b9bd}
    .top-actions{display:flex;gap:9px;align-items:center}.button{border:1px solid #3e555d;border-radius:9px;padding:9px 13px;background:#1c2c34;color:#eaf4f0}
    .button:hover{border-color:#79d5af}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:20px}
    .metric{padding:18px 20px;border:1px solid #30444c;border-radius:14px;background:#1a2931}.metric strong{display:block;margin-top:8px;font-size:31px;line-height:1.1}
    .metric span{color:#a9babe;font-size:13px}.metric.active strong{color:#85d8b3}.metric.warn strong{color:#f4b38c}
    .toolbar{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-bottom:14px}.filters{display:flex;gap:10px;flex-wrap:wrap}
    .archive-toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:0 0 18px}.archive-toolbar select{max-width:100%}.archive-toolbar input{min-width:150px;width:170px}.archive-note{width:100%;font-size:12px;color:#a9babe}
    input,select{border:1px solid #3d545c;border-radius:9px;padding:10px 12px;background:#192830;color:#edf3f1;outline:none}
    input{min-width:260px}input:focus,select:focus{border-color:#79d5af}.updated{font-size:13px;color:#a9babe;text-align:right}
    .notice{padding:11px 14px;border:1px solid #5c4f32;border-radius:9px;background:#30291d;color:#f4d7a2;margin-bottom:14px;display:none}
    .rooms{display:grid;gap:10px}.room{border:1px solid #30444c;border-radius:13px;background:#19272f;overflow:hidden}
    summary{list-style:none;cursor:pointer;padding:17px 20px}summary::-webkit-details-marker{display:none}.room-head{display:grid;grid-template-columns:1.2fr 1.1fr .8fr 1fr 1fr 1.3fr;gap:12px;align-items:center}
    .room-code{font-size:17px;font-weight:800;letter-spacing:.04em}.sub{display:block;color:#9eb0b4;font-size:12px;margin-top:4px}.value{font-size:14px}
    .member-summary{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin-top:11px}.member-summary-label{color:#9eb0b4;font-size:12px;margin-right:3px}
    .member-chip{max-width:100%;padding:4px 9px;border:1px solid #3b6054;border-radius:99px;background:#213b34;color:#d8f1e4;font-size:12px;overflow-wrap:anywhere}
    .member-chip.offline{border-color:#445259;background:#27343a;color:#a9b9bd}.member-chip.reconnecting{border-color:#705d3a;background:#493d2b;color:#f3d39c}
    .room-action{display:flex;justify-content:flex-end;margin-top:8px}.log-button{font-size:12px;padding:6px 10px}
    .pill{display:inline-block;padding:5px 9px;border-radius:99px;background:#33434a;color:#d5e2e0;font-size:12px;font-weight:700}
    .pill.started,.pill.connected{background:#1f4b3e;color:#9be7be}.pill.disconnected{background:#513c2b;color:#f4c39b}.pill.finished{background:#3c4054;color:#c7caef}
    .group-title{margin:16px 2px 4px;color:#a9babe;font-size:14px;font-weight:700}
    .today-summary{margin-top:12px;padding:9px 12px;background:#14242b;border-radius:8px;color:#bbd7d0;font-size:12px;line-height:1.7;overflow-wrap:anywhere}
    .today-history{border-top:1px solid #30444c;padding:14px 20px}.today-history h3{font-size:14px;margin:0 0 5px}.history-note{font-size:12px;color:#9eb0b4;line-height:1.7}
    .history-run{display:grid;grid-template-columns:1fr 1.2fr;gap:7px 20px;padding:12px 0;border-bottom:1px solid #2a3c44;font-size:13px;overflow-wrap:anywhere}.history-run:last-child{border-bottom:0}.history-members{grid-column:1/-1;color:#b6c6c7;font-size:12px}.history-warning{color:#f4c39b;margin:6px 0;font-size:12px}.history-result.completed{color:#9be7be}.history-result.unknown,.history-result.failed,.history-result.stopped,.history-result.completedWithErrors{color:#f4c39b}
    .members{border-top:1px solid #30444c;padding:4px 20px 14px}.member{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr 1.1fr;gap:10px;padding:12px 0;border-bottom:1px solid #2a3c44;font-size:13px}
    .member:last-child{border-bottom:0}.member-head{color:#91a7ac;font-size:12px;font-weight:700}.member strong{font-size:14px}.empty{padding:54px 20px;text-align:center;color:#a7b8bc;border:1px dashed #40555c;border-radius:13px}
    dialog{width:min(920px,calc(100vw - 28px));max-height:82vh;padding:22px;border:1px solid #49616a;border-radius:15px;background:#17252d;color:#edf3f1;box-shadow:0 25px 80px #0009}
    dialog::backdrop{background:#071016bc}.log-head{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}.log-head h2{margin:0;font-size:20px}.log-actions{display:flex;gap:8px;flex-wrap:wrap}.button:disabled{cursor:wait;opacity:.65}
    .log-hint{color:#a9babe;font-size:12px;margin:9px 0 15px}.log-lines{max-height:58vh;overflow:auto;border-top:1px solid #31464f}.log-line{padding:10px 2px;border-bottom:1px solid #2b3e46;font-size:13px}
    .log-range{margin:0 0 14px;padding:13px;border:1px solid #38515b;border-radius:10px;background:#142129}.range-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
    .range-row>span{width:42px;color:#b5c8ca;font-size:13px}.range-row select,.range-row input{padding:8px;border-radius:7px}.range-row .range-date{min-width:155px;width:165px}.range-time{min-width:65px}.range-presets{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.range-presets .button{padding:6px 10px;font-size:12px}.range-note{font-size:12px;color:#9fb5b9}.range-status{font-size:13px;min-height:20px;margin:7px 0;color:#bad4d6}
    .log-meta{color:#8eacb2;font-size:12px;margin-bottom:5px}.log-message{white-space:pre-wrap;overflow-wrap:anywhere}.log-line.warning .log-meta{color:#f4c08c}.log-line.error .log-meta,.log-line.critical .log-meta{color:#ffaaa0}
    @media(max-width:850px){.metrics{grid-template-columns:repeat(2,1fr)}.room-head{grid-template-columns:1fr 1fr 1fr}.top{align-items:flex-start}.toolbar{align-items:flex-start;flex-direction:column}.updated{text-align:left}}
    @media(max-width:560px){.shell{padding:20px 14px 50px}.top h1{font-size:24px}.top{flex-direction:column}.metrics{gap:8px}.metric{padding:14px}.metric strong{font-size:25px}
      input{min-width:0;width:100%}.filters{width:100%}.filters input{flex:1 1 100%}.filters select{flex:1}.room-head{grid-template-columns:1fr 1fr;gap:13px}.members{overflow-x:auto}.member{min-width:650px}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="top">
      <div><div class="eyebrow">BGI COORDINATOR · LIVE</div><h1>联机锄地全服监控</h1><div class="subtitle">服务器实时房间 · 只读</div></div>
      <div class="top-actions"><button id="refresh" class="button" type="button">刷新</button><button id="logout" class="button" type="button">退出</button></div>
    </header>
    <section class="metrics" aria-label="全服概况">
      <div class="metric active"><span>已连接控制房间</span><strong id="controlRooms">—</strong></div>
      <div class="metric"><span>已连接成员</span><strong id="controlMembers">—</strong></div>
      <div class="metric"><span>锄地房间</span><strong id="totalRooms">—</strong></div>
      <div class="metric warn"><span>已开锄且有人在线</span><strong id="startedRooms">—</strong></div>
    </section>
    <div class="toolbar">
      <div class="filters"><input id="search" type="search" placeholder="搜索房间码、昵称或 UID" aria-label="搜索房间"><select id="filter" aria-label="筛选房间状态"><option value="all">全部状态</option><option value="connected">已连接</option><option value="today">今日有记录</option><option value="started">已开锄</option><option value="waiting">等待开锄</option><option value="disconnected">无人在线</option><option value="finished">本轮结束</option></select></div>
      <div id="updated" class="updated" aria-live="polite">正在连接服务器…</div>
    </div>
    <div class="archive-toolbar" role="group" aria-label="历史房间日志">
      <select id="archiveRoom" aria-label="已保存日志的历史房间"><option value="">正在读取历史房间…</option></select>
      <input id="archiveCode" type="text" maxlength="6" placeholder="或输入房间码" aria-label="历史房间码">
      <button id="archiveOpen" class="button" type="button">查询历史日志</button>
      <span id="archiveStatus" class="archive-note" role="status">房间已结束或服务器重启后，仍可从这里下载已保存的日志。</span>
    </div>
    <div id="notice" class="notice" role="status"></div>
    <section id="rooms" class="rooms" aria-label="房间列表"></section>
  </main>
  <dialog id="logDialog" aria-labelledby="logTitle">
    <div class="log-head"><h2 id="logTitle">服务器日志</h2><div class="log-actions"><button id="logDownload" class="button" type="button">下载所选日志</button><button id="logRefresh" class="button" type="button">刷新</button><button id="logClose" class="button" type="button">关闭</button></div></div>
    <div class="log-hint">下载按所选时间读取持久保存的服务器日志，包含已确认关联的历史锄地房间，不受预览的 200 条限制。下方仅是本次启动后的实时预览。旧版漏存或关联不明的内容会提示缺口，不包含成员本机日志。</div>
    <div class="log-range" role="group" aria-label="日志下载时间范围（北京时间）">
      <div class="range-row"><span>开始</span><input id="logStartDate" type="date" class="range-date" aria-label="开始日期"><select id="logStartHour" class="range-time" aria-label="开始小时"></select><span style="width:auto">时</span><select id="logStartMinute" class="range-time" aria-label="开始分钟"></select><span style="width:auto">分</span></div>
      <div class="range-row"><span>结束</span><input id="logEndDate" type="date" class="range-date" aria-label="结束日期"><select id="logEndHour" class="range-time" aria-label="结束小时"></select><span style="width:auto">时</span><select id="logEndMinute" class="range-time" aria-label="结束分钟"></select><span style="width:auto">分</span></div>
      <div class="range-presets"><button id="logToday" class="button" type="button">今天全天</button><button id="logLastHour" class="button" type="button">最近一小时</button><span class="range-note">北京时间 · 日期可点击日历选择 · 包含结束分钟整分钟</span></div>
      <div id="logAvailableDates" class="range-note" role="status"></div>
      <div id="logRangeStatus" class="range-status" role="status"></div>
    </div>
    <div id="logDownloadStatus" class="range-status" role="status"></div>
    <div id="logStatus" class="muted" role="status"></div>
    <div id="logLines" class="log-lines"></div>
  </dialog>
  <script data-hoeing-history>
// Pure presentation helpers shared by the admin page and its focused checks.
(() => {
    const labels = {
        preparing: '准备开锄', running: '锄地中', completed: '已完成',
        completedWithErrors: '已结束，含任务异常', stopped: '已中止', failed: '异常结束', unknown: '结束未确认'
    };
    function runLabel(run) {
        if (!run.startedAtUtc) {
            if (run.status === 'completed') return '流程已完成，未收到开锄上报';
            if (run.status === 'completedWithErrors') return '流程结束，含任务异常，未收到开锄上报';
            if (run.status === 'running') return '流程执行中，等待开锄上报';
            if (run.status === 'unknown') return '开锄未确认，流程结果未知';
        }
        return labels[run.status] || '结果未知';
    }
    function time(value, date) {
        if (!value) return '未记录';
        const instant = new Date(value);
        if (!Number.isFinite(instant.getTime())) return '未记录';
        const localDate = new Date(instant.getTime() + 8 * 3600000).toISOString().slice(0, 10);
        const clock = instant.toLocaleTimeString('zh-CN', { timeZone: 'Asia/Shanghai', hour12: false });
        return localDate === date ? clock : localDate + ' ' + clock;
    }
    function latest(day) {
        return (day?.runs || []).reduce((found, run) => !found || Date.parse(run.requestedAtUtc) >= Date.parse(found.requestedAtUtc) ? run : found, null);
    }
    function reasonText(reason) {
        if (!reason) return '';
        if (/[\u4e00-\u9fff]/.test(reason)) return reason;
        if (reason.startsWith('completed_with_task_errors:')) return '部分成员的本地任务出现异常，详见服务器日志';
        if (reason.startsWith('participant_failed:')) return '成员任务失败';
        return {
            manual_reset: '手动重置', user_stop_all: '用户停止全部任务', unexpected_stop: '任务意外停止',
            registration_timeout: '成员注册超时', preparation_timeout: '开锄准备超时', takeover_timeout: '任务接管超时',
            cleanup_timeout: '停止清理超时', partial_completion_no_replay: '成员完成进度不一致，未重复执行',
            recovery_budget_exhausted: '恢复未成功', server_restarted: '服务器重启，结束结果未确认',
            status_idle: '已无锄地上报，结束结果未确认', disconnected: '成员断线，结束结果未确认',
            shared_recovery: '正在恢复任务'
        }[reason] || '结束详情请查看服务器日志';
    }
    function headline(day) {
        if (!day) return '今日记录不可用';
        const run = latest(day);
        if (!run) return day.warnings?.length ? '今日记录不完整' : '今日暂无记录';
        const active = day.runs.find(item => item.status === 'running') || day.runs.find(item => item.status === 'preparing');
        return runLabel(active || run);
    }
    function overview(day) {
        if (!day) return '无法读取今日锄地记录';
        const runs = day.runs || [], started = runs.filter(run => run.startedAtUtc);
        if (!runs.length) return '仅统计启用记录后收到的上报；暂无记录不代表今天没锄。';
        const completed = started.filter(run => run.status === 'completed').length;
        const todayStarts = started.filter(run => new Date(Date.parse(run.startedAtUtc) + 8 * 3600000).toISOString().slice(0, 10) === day.date).length;
        const text = [`今日开锄 ${todayStarts} 次`];
        if (todayStarts < started.length) text.push(`跨日继续 ${started.length - todayStarts} 次`);
        text.push(`已完成 ${completed} 次`);
        const errors = started.filter(run => run.status === 'completedWithErrors').length;
        if (errors) text.push(`含任务异常 ${errors} 次`);
        const run = latest(day);
        text.push(`最近${run.startedAtUtc ? '开锄' : '尝试'} ${time(run.startedAtUtc || run.requestedAtUtc, day.date)}`);
        if (run.endedAtUtc) text.push(`结束 ${time(run.endedAtUtc, day.date)}`);
        return text.join(' · ');
    }
    globalThis.AdminHoeingHistory = { runLabel, time, headline, overview, reasonText };
})();
  </script>
  <script>
    const $=id=>document.getElementById(id);
    const labels={started:'已开锄',waiting:'等待开锄',disconnected:'无人在线',finished:'本轮结束'};
    const memberStates={Waiting:'等待',Ready:'就绪',Pathing:'路径中',WaitingAtSync:'同步等待',Fighting:'战斗中'};
    let snapshot=null;
    function node(tag,className,value){const item=document.createElement(tag);if(className)item.className=className;if(value!==undefined)item.textContent=String(value);return item;}
    function duration(start){if(!start)return '未记录';const seconds=Math.max(0,Math.floor((Date.now()-Date.parse(start))/1000));const hours=Math.floor(seconds/3600);const minutes=Math.floor(seconds%3600/60);return hours?`${hours}小时${minutes}分`:`${minutes}分`;}
    function heartbeat(time){if(!time)return '未上报';const age=Math.max(0,Math.floor((Date.now()-Date.parse(time))/1000));return age<60?`${age}秒前`:`${Math.floor(age/60)}分钟前`;}
    function route(room){const numbers=room.members.filter(member=>member.online&&member.routeNumber!==null).map(member=>member.routeNumber);if(!numbers.length||room.totalRoutes===null)return '未上报';const min=Math.min(...numbers),max=Math.max(...numbers);return `第 ${min}${min===max?'':'–'+max} / ${room.totalRoutes} 条`;}
    function cell(value,sub){const box=node('div','value',value);if(sub!==undefined)box.append(node('span','sub',sub));return box;}
    function todayHistory(day){
      const section=node('section','today-history');
      section.append(node('h3','',`今日锄地记录${day?' · '+day.date:''}（北京时间）`));
      section.append(node('div','history-note','按实际开锄上报计次；完成由全队流程结果确认。断线、空闲或单个成员完成不能证明全队完成。'));
      if(!day){section.append(node('div','history-warning','今日记录读取失败'));return section;}
      for(const warning of day.warnings||[])section.append(node('div','history-warning',warning));
      if(!day.runs.length)section.append(node('div','history-note','今日暂无记录；启用前未保存的行为无法补回。'));
      for(const run of [...day.runs].reverse()){
        const row=node('div','history-run');
        row.append(cell(`${run.startedAtUtc?'开锄':'尝试'} ${AdminHoeingHistory.time(run.startedAtUtc||run.requestedAtUtc,day.date)}`,
          run.endedAtUtc?'结束 '+AdminHoeingHistory.time(run.endedAtUtc,day.date):'最近上报 '+AdminHoeingHistory.time(run.observedAtUtc,day.date)));
        const result=cell(AdminHoeingHistory.runLabel(run),AdminHoeingHistory.reasonText(run.reason)||undefined);result.classList.add('history-result',run.status);row.append(result);
        row.append(node('div','history-members','参与成员：'+(run.members.map(member=>member.name||member.uid).join('、')||'未记录')));
        section.append(row);
      }
      return section;
    }
    function memberSummary(members){
      const summary=node('div','member-summary');summary.append(node('span','member-summary-label','成员'));
      if(!members.length){summary.append(node('span','member-summary-label','暂无'));return summary;}
      for(const member of members){
        const state=member.reconnecting?'reconnecting':member.online?'':'offline';
        const suffix=member.reconnecting?'（重连中）':member.online?'':'（离线）';
        summary.append(node('span','member-chip '+state,(member.name||member.uid||'未命名')+suffix));
      }
      return summary;
    }
    let activeLogCode=null,logRequest=0,logDateRequest=0,logDownloading=false;
    const rangeControls=['logStartDate','logStartHour','logStartMinute','logEndDate','logEndHour','logEndMinute'];
    function beijingMinute(time=Date.now()){return new Date(time+8*60*60*1000).toISOString().slice(0,16);}
    function setLogRange(start,end){
      $('logStartDate').value=start.slice(0,10);$('logStartHour').value=start.slice(11,13);$('logStartMinute').value=start.slice(14,16);
      $('logEndDate').value=end.slice(0,10);$('logEndHour').value=end.slice(11,13);$('logEndMinute').value=end.slice(14,16);updateLogRange();
    }
    function selectedLogRange(){return {start:`${$('logStartDate').value}T${$('logStartHour').value}:${$('logStartMinute').value}`,end:`${$('logEndDate').value}T${$('logEndHour').value}:${$('logEndMinute').value}`};}
    function updateLogRange(){
      const {start,end}=selectedLogRange();let error='';
      if(!$('logStartDate').value||!$('logEndDate').value)error='请点击日历选择开始和结束日期';
      else if(start>end)error='结束时间不能早于开始时间，请重新选择';
      $('logRangeStatus').textContent=error||`${start.replace('T',' ')} 至 ${end.replace('T',' ')}（北京时间）`;
      $('logDownload').disabled=logDownloading||!!error;
      return !error;
    }
    function todayLogRange(){const today=beijingMinute().slice(0,10);setLogRange(today+'T00:00',today+'T23:59');}
    async function loadLogDates(code){
      const request=++logDateRequest;
      $('logAvailableDates').textContent='正在读取已保存日期…';
      try{
        const response=await fetch(`/api/admin/rooms/${encodeURIComponent(code)}/logs/dates`,{credentials:'same-origin',cache:'no-store'});
        if(response.status===401){location.replace('/admin/login');return;}
        if(!response.ok)throw new Error();
        const data=await response.json();if(request!==logDateRequest||activeLogCode!==code)return;
        const dates=data.dates||[];
        $('logAvailableDates').textContent=dates.length?`已保存日期：${dates.at(-1)} 至 ${dates[0]}；可用日历选择任意时间范围`:'暂无已保存日期，可直接选择时间查询';
      }catch{if(request===logDateRequest&&activeLogCode===code)$('logAvailableDates').textContent='已保存日期读取失败，仍可选择时间直接下载';}
    }
    async function loadArchiveRooms(){
      const selected=$('archiveRoom').value;
      try{
        const response=await fetch('/api/admin/logs/rooms',{credentials:'same-origin',cache:'no-store'});
        if(response.status===401){location.replace('/admin/login');return;}
        if(!response.ok)throw new Error();
        const data=await response.json();$('archiveRoom').replaceChildren(new Option('选择已保存日志的历史房间',''));
        for(const room of data.rooms){const dates=room.dates||[];$('archiveRoom').add(new Option(`${room.code}${room.kind==='control'?' · 控制房间':''}${dates.length?' · '+dates.at(-1)+' 至 '+dates[0]:''}`,room.code));}
        $('archiveRoom').value=selected;$('archiveStatus').textContent='房间已结束或服务器重启后，仍可查询已保存日志；控制房间下载会合并已确认关联的历史锄地房间。';
      }catch{$('archiveRoom').replaceChildren(new Option('历史房间读取失败，可输入房间码',''));$('archiveStatus').textContent='历史列表读取失败，可输入房间码直接查询。';}
    }
    function logButton(code){const action=node('div','room-action'),button=node('button','button log-button','服务器日志');button.type='button';button.addEventListener('click',event=>{event.preventDefault();event.stopPropagation();openLogs(code);});action.append(button);return action;}
    function openLogs(code){activeLogCode=code;$('logDownloadStatus').textContent='';$('logTitle').textContent=`房间 ${code} · 服务器日志`;todayLogRange();$('logDialog').showModal();loadLogs();loadLogDates(code);}
    async function downloadLogs(){
      const code=activeLogCode,view=logDateRequest;if(!code||logDownloading||!updateLogRange())return;
      const {start,end}=selectedLogRange(),button=$('logDownload');logDownloading=true;button.disabled=true;button.textContent='正在下载…';
      $('logDownloadStatus').textContent='正在准备所选时段的日志…';
      try{
        const query=new URLSearchParams({start,end});
        const response=await fetch(`/api/admin/rooms/${encodeURIComponent(code)}/logs/download?${query}`,{credentials:'same-origin',cache:'no-store'});
        if(response.status===401){location.replace('/admin/login');return;}
        if(!response.ok){const problem=await response.json().catch(()=>({}));throw new Error(problem.detail||'下载失败，请稍后重试');}
        const blob=await response.blob(),url=URL.createObjectURL(blob),link=document.createElement('a');
        if(activeLogCode!==code||view!==logDateRequest){URL.revokeObjectURL(url);return;}
        const disposition=response.headers.get('Content-Disposition')||'';
        link.href=url;link.download=(disposition.match(/filename="?([^";]+)"?/i)||[])[1]||`room-${code}-${start.replace(/[:T]/g,'-')}.txt`;
        document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);
        const count=response.headers.get('X-Room-Log-Count'),sources=response.headers.get('X-Room-Log-Sources'),sourceCount=Number(response.headers.get('X-Room-Log-Source-Count')||0);
        const first=response.headers.get('X-Room-Log-First-Utc'),last=response.headers.get('X-Room-Log-Last-Utc');
        const format=time=>new Date(time).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai',hour12:false});
        let warnings=[];try{warnings=JSON.parse(decodeURIComponent(response.headers.get('X-Room-Log-Warnings')||'%5B%5D'));}catch{warnings=['下载摘要读取失败，请查看TXT文件内的保存说明'];}
        $('logDownloadStatus').textContent=`已发起下载${count!==null?'，共 '+count+' 条':''}${sources?'，来源房间 '+sources+(sourceCount>20?' 等 '+sourceCount+' 个（完整列表见TXT）':''):''}${first&&last?'；实际记录 '+format(first)+' 至 '+format(last)+'（北京时间）':''}${warnings.length?'。保存说明：'+warnings.join('；'):''}`;
      }catch(error){if(activeLogCode===code&&view===logDateRequest)$('logDownloadStatus').textContent=error.message||'下载失败，请稍后重试';}
      finally{logDownloading=false;button.textContent='下载所选日志';updateLogRange();}
    }
    async function loadLogs(){
      if(!activeLogCode||!$('logDialog').open)return;
      const request=++logRequest,code=activeLogCode;
      $('logStatus').textContent='正在读取…';$('logLines').replaceChildren();
      try{
        const response=await fetch(`/api/admin/rooms/${encodeURIComponent(code)}/logs`,{credentials:'same-origin',cache:'no-store'});
        if(response.status===401){location.replace('/admin/login');return;}
        if(!response.ok)throw new Error('HTTP '+response.status);
        const data=await response.json();
        if(request!==logRequest||!$('logDialog').open)return;
        $('logStatus').textContent=data.entries.length?`实时预览：最近 ${data.entries.length} 条（下载条数另行统计）`:'本次启动暂无此房间的实时预览；历史日志仍可下载';
        for(const entry of data.entries){
          const line=node('div','log-line '+entry.level.toLowerCase());
          line.append(node('div','log-meta',`${new Date(entry.timestampUtc).toLocaleString('zh-CN')} · ${entry.level} · ${entry.category}`));
          line.append(node('div','log-message',entry.message));$('logLines').append(line);
        }
      }catch{if(request===logRequest&&$('logDialog').open)$('logStatus').textContent='读取失败，请点击刷新重试';}
    }
    function render(){
      if(!snapshot)return;
      $('controlRooms').textContent=snapshot.connectedControlRoomCount;
      $('controlMembers').textContent=snapshot.connectedControlMemberCount;
      $('totalRooms').textContent=snapshot.totalRoomCount;
      $('startedRooms').textContent=snapshot.startedRoomCount;
      const open=new Set([...document.querySelectorAll('details.room[open]')].map(item=>item.dataset.code));
      const query=$('search').value.trim().toLowerCase(),filter=$('filter').value;
      const controls=(snapshot.controlRooms||[]).filter(room=>(filter==='all'||filter==='connected'&&room.onlineCount>0||filter==='disconnected'&&room.onlineCount===0||filter==='today'&&room.todayHoeing?.runs?.length>0)&&(!query||room.code.toLowerCase().includes(query)||room.members.some(member=>member.name.toLowerCase().includes(query)||member.uid.toLowerCase().includes(query))));
      const matched=snapshot.rooms.filter(room=>(filter==='all'||room.status===filter)&&(!query||room.code.toLowerCase().includes(query)||room.hostName.toLowerCase().includes(query)||room.members.some(member=>member.name.toLowerCase().includes(query)||member.uid.toLowerCase().includes(query))));
      const list=$('rooms');list.replaceChildren();
      if(!controls.length&&!matched.length){list.append(node('div','empty',snapshot.controlRooms?.length||snapshot.totalRoomCount?'没有符合条件的房间':'服务器当前没有已连接房间'));return;}
      if(controls.length){
        list.append(node('div','group-title','控制房间 · 今日锄地记录'));
        for(const room of controls){
          const details=node('details','room');details.dataset.code='control:'+room.code;details.open=open.has(details.dataset.code);
          const summary=node('summary'),head=node('div','room-head');
          head.append(cell(room.code,'控制房间码'));
          const state=node('div');state.append(node('span','pill '+(room.onlineCount?'connected':'disconnected'),room.onlineCount?'已连接':'无人在线'));head.append(state);
          head.append(cell(`${room.onlineCount} / ${room.memberCount}`,'在线 / 成员'));
          head.append(cell(room.autoHoeingRunning?'有成员锄地中':room.onlineCount?'未上报锄地中':'暂无在线成员','助手当前上报'));
          head.append(cell(AdminHoeingHistory.headline(room.todayHoeing),'今日锄地 · 北京时间'));
          head.append(cell(heartbeat(room.lastHeartbeatUtc),'最近状态'));
          summary.append(head,node('div','today-summary',AdminHoeingHistory.overview(room.todayHoeing)+' · 点击展开记录'),memberSummary(room.members),logButton(room.code));details.append(summary,todayHistory(room.todayHoeing));
          const members=node('div','members');
          const header=node('div','member member-head');['成员','连接','助手状态','当前线路','最近心跳'].forEach(text=>header.append(node('div','',text)));members.append(header);
          for(const member of room.members){
            const row=node('div','member');row.append(cell(member.name||'未命名','UID '+(member.uid||'未上报')));
            row.append(node('div','',member.online?'在线':'离线'));
            row.append(node('div','',member.online?(member.autoHoeingRunning?'锄地中':'已连接'):'—'));
            row.append(node('div','',member.online&&member.autoHoeingRunning?(member.routeDisplay||member.progress||'—'):'—'));
            row.append(node('div','',heartbeat(member.lastHeartbeatUtc)));members.append(row);
          }
          details.append(members);list.append(details);
        }
      }
      if(matched.length)list.append(node('div','group-title','游戏锄地房间'));
      for(const room of matched){
        const details=node('details','room');details.dataset.code='game:'+room.code;details.open=open.has(details.dataset.code);
        const summary=node('summary'),head=node('div','room-head');
        head.append(cell(room.code,'房间码 · '+room.hostName));
        const state=node('div');state.append(node('span','pill '+room.status,labels[room.status]||'未知'));head.append(state);
        head.append(cell(`${room.onlineCount} / ${room.memberCount}`,'在线 / 房内成员'));
        head.append(cell(room.startedAtUtc?duration(room.startedAtUtc):'—','开锄时长'));
        head.append(cell(room.worldRound?`第 ${room.worldRound} 轮`:'—','世界轮次'));
        head.append(cell(route(room),'最近线路 · 心跳 '+heartbeat(room.lastHeartbeatUtc)));
        summary.append(head,memberSummary(room.members),logButton(room.code));details.append(summary);
        const members=node('div','members');
        const header=node('div','member member-head');['成员','连接','最近状态','最近线路','最近心跳'].forEach(text=>header.append(node('div','',text)));members.append(header);
        for(const member of room.members){
          const row=node('div','member');row.append(cell(member.name||'未命名','UID '+(member.uid||'未上报')));
          row.append(node('div','',member.reconnecting?'重连中':member.online?'在线':'离线'));
          row.append(node('div','',member.online?(memberStates[member.status]||member.status):'—'));
          row.append(node('div','',member.routeNumber!==null&&room.totalRoutes!==null?`第 ${member.routeNumber} / ${room.totalRoutes} 条`:'未上报'));
          row.append(node('div','',heartbeat(member.lastHeartbeatUtc)));members.append(row);
        }
        details.append(members);list.append(details);
      }
    }
    async function load(){
      try{
        const response=await fetch('/api/admin/rooms',{credentials:'same-origin',cache:'no-store'});
        if(response.status===401){location.replace('/admin/login');return;}
        if(!response.ok)throw new Error('HTTP '+response.status);
        snapshot=await response.json();render();
        $('updated').textContent='更新于 '+new Date(snapshot.capturedAtUtc).toLocaleTimeString('zh-CN');
        $('notice').style.display='none';
      }catch{
        $('notice').textContent='无法取得最新状态，以下数据可能已经过期。';$('notice').style.display='block';
        $('updated').textContent='连接失败';
      }
    }
    $('search').addEventListener('input',render);$('filter').addEventListener('change',render);$('refresh').addEventListener('click',load);
    $('archiveRoom').addEventListener('change',()=>{$('archiveCode').value='';});
    $('archiveOpen').addEventListener('click',()=>{const code=($('archiveCode').value.trim()||$('archiveRoom').value).toUpperCase();if(!/^[A-Z0-9]{6}$/.test(code)){$('archiveStatus').textContent='请选择历史房间，或输入六位房间码。';return;}openLogs(code);});
    $('logout').addEventListener('click',async()=>{await fetch('/api/admin/logout',{method:'POST',credentials:'same-origin'});location.replace('/admin/login');});
    $('logDownload').addEventListener('click',downloadLogs);$('logRefresh').addEventListener('click',loadLogs);$('logClose').addEventListener('click',()=>$('logDialog').close());
    for(const id of ['logStartHour','logEndHour','logStartMinute','logEndMinute']){const max=id.endsWith('Hour')?24:60;for(let index=0;index<max;index++){const value=String(index).padStart(2,'0');$(id).add(new Option(value,value));}}
    for(const id of rangeControls)$(id).addEventListener('change',()=>{$('logDownloadStatus').textContent='';updateLogRange();});
    $('logToday').addEventListener('click',()=>{$('logDownloadStatus').textContent='';todayLogRange();});
    $('logLastHour').addEventListener('click',()=>{$('logDownloadStatus').textContent='';setLogRange(beijingMinute(Date.now()-3600000),beijingMinute());});
    $('logDialog').addEventListener('close',()=>{activeLogCode=null;logRequest++;logDateRequest++;});
    load();loadArchiveRooms();setInterval(load,10000);
  </script>
</body>
</html>
