name: 发布构建产物（自动 / 手动补发）
run-name: ${{ github.event_name == 'workflow_dispatch' && format('手动补发构建 #{0}', inputs.run_id) || format('自动发布构建 #{0}', github.event.workflow_run.id) }}

on:
  workflow_run:
    workflows: [BetterGI Publish]
    types: [completed]
    branches: [main, 'main-OldTeaBag-B*']
  workflow_dispatch:
    inputs:
      run_id:
        description: '成功构建编号（BetterGI Publish 的 Actions 地址末尾数字）'
        required: true
        type: string
      notes:
        description: '更新说明（可选；留空时注明构建来源）'
        required: false
        type: string

permissions: {}

jobs:
  inspect:
    if: >-
      github.repository == 'kaedelcb/better-genshin-impact' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.source.outputs.version }}
      sha: ${{ steps.source.outputs.sha }}
      attempt: ${{ steps.source.outputs.attempt }}
      publish: ${{ steps.source.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: 核对来源、版本和必需产物
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -B tools/release_actions.py inspect

  publish:
    needs: inspect
    if: needs.inspect.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: bettergi-release-${{ needs.inspect.outputs.version }}
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: 校验并发布两项原始附件
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_VERSION: ${{ needs.inspect.outputs.version }}
          EXPECTED_SHA: ${{ needs.inspect.outputs.sha }}
          EXPECTED_ATTEMPT: ${{ needs.inspect.outputs.attempt }}
        run: python -B tools/release_actions.py publish
