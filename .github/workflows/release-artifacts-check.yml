name: 发布配置离线检查

on:
  push:
    paths:
      - '.github/workflows/publish.yml'
      - '.github/workflows/release-artifacts-check.yml'
      - 'tools/release_actions.py'
      - 'Test/ReleaseActions/**'
  pull_request:
    paths:
      - '.github/workflows/publish.yml'
      - '.github/workflows/release-artifacts-check.yml'
      - 'tools/release_actions.py'
      - 'Test/ReleaseActions/**'

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: 安装 YAML 静态检查依赖
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.3
      - name: 运行离线逻辑与工作流静态检查（不发布 Release）
        run: python -B -m unittest discover -s Test/ReleaseActions -v
