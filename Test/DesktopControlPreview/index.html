<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>桌面控制隔离界面检查</title>
<link rel="stylesheet" href="../../BgiCoordinatorServer/wwwroot/control-room.css"><link rel="stylesheet" href="../../BgiCoordinatorServer/wwwroot/dodoco-web.css">
<style>body{margin:0;padding:20px;background:#101321;color:#e8ebf3}main{max-width:1200px;margin:auto}.preview-note{padding:10px;border:1px solid #63709a;border-radius:8px;margin-bottom:16px}dialog{background:#20253a;color:#eef1ff;border:1px solid #66749e;border-radius:8px}dialog button{padding:10px;margin:5px}</style></head>
<body><main><p class="preview-note">隔离界面检查：加载正式网页脚本和样式，成员、截图与回执均为测试数据。不会连接服务器、执行键鼠或启动 BGI。</p><div id="dodocoView"></div></main>
<dialog id="shortcutPreview"><h3>选择快捷键（隔离数据）</h3><p id="shortcutTarget"></p><p>暂停当前脚本/独立任务 (D9)</p><p>停止当前脚本/独立任务 (F12)</p><button onclick="this.closest('dialog').close()">取消</button></dialog>
<script>
let players=[{playerUid:'preview-a',playerName:'测试队友 A',online:true,hotkeys:[{configName:'SuspendHotkey',functionName:'暂停当前脚本/独立任务',hotkeyText:'D9'},{configName:'CancelTaskHotkey',functionName:'停止当前脚本/独立任务',hotkeyText:'F12'}]},{playerUid:'preview-b',playerName:'测试队友 B',online:true,hotkeys:[]}];
let roomReady=true,roomCode='PREVIEW';
const escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const makeEnvelope=(type,name,payload)=>({type,name,payload});
function checkGatewayError(r){if(r?.payload?.error)throw Error(r.payload.error.message);}
function newRequestId(){return Array.from(crypto.getRandomValues(new Uint8Array(16)),x=>x.toString(16).padStart(2,'0')).join('');}
function showHome(){}
function showHotkeySelect(uid,name,host){
 if(host){const panel=document.createElement('div');panel.className='modal-overlay';panel.innerHTML='<div class="modal"><h3>选择快捷键（隔离数据）</h3><p></p><p>暂停当前脚本/独立任务 (D9)</p><p>停止当前脚本/独立任务 (F12)</p><button type="button">取消</button></div>';panel.querySelector('p').textContent=name+' ('+uid+')';panel.querySelector('button').onclick=()=>panel.remove();host.appendChild(panel);return;}
 document.getElementById('shortcutTarget').textContent=name+' ('+uid+')';document.getElementById('shortcutPreview').showModal();
}
window.previewInputs=[];window.previewCaptures=0;
function testJpeg(){const c=document.createElement('canvas');c.width=1280;c.height=720;const x=c.getContext('2d');x.fillStyle='#23314d';x.fillRect(0,0,1280,720);x.fillStyle='#15213a';x.fillRect(120,90,1040,540);x.fillStyle='#f2e3b6';x.font='32px sans-serif';x.fillText('测试桌面 — 2560 × 1440 / 150% DPI',180,170);x.fillStyle='#a8bad8';x.font='24px sans-serif';x.fillText('这里只检查图片映射与交互，不执行真实输入。',180,235);x.fillText('截图序号 '+window.previewCaptures,180,285);x.fillStyle='#c8a74d';x.fillRect(470,380,340,90);x.fillStyle='#202028';x.font='30px sans-serif';x.fillText('测试确认按钮',540,438);return c.toDataURL('image/jpeg',.8).split(',')[1];}
const connection={state:'Connected',async invoke(method,env){const p=env.payload||{};
if(env.name==='screenshot.request'){window.previewCaptures++;const frame={uid:p.targetUid,requestId:p.requestId,jpegBase64:testJpeg(),width:1280,height:720,capturedAt:new Date().toISOString(),geometry:{left:0,top:0,width:2560,height:1440,displayId:'preview-primary',layoutId:'2560x1440-dpi144'},controlAllowed:true};setTimeout(()=>dodocoEvent({name:'screenshot.member',payload:frame}),40);}
if(env.name==='desktop.control.presence' && p.presence.action!=='end'){const presence=p.presence;setTimeout(()=>dodocoEvent({name:'desktop.control.presence.result',payload:{requestId:presence.requestId,controlId:presence.controlId,targetUid:presence.targetUid,status:'active'}}),40);}
if(env.name==='desktop.control.request'){window.previewInputs.push(p.command);setTimeout(()=>dodocoEvent({name:'desktop.control.result',payload:{requestId:p.command.requestId,targetUid:p.command.targetUid,status:'executed',message:'隔离检查：系统输入由假执行器确认，未操作真实桌面'}}),80);}
return {payload:{accepted:true,ack:true}};}};
</script><script src="../../BgiCoordinatorServer/wwwroot/dodoco-web.js"></script>
<script>dodoco.active=true;dodoco.tab='screen';dodoco.target='preview-a';dodocoRender();dodocoCapture();</script></body></html>
